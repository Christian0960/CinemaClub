<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Virtual Cinema</title>
  <style>
    body {
      margin: 0;
      background: radial-gradient(circle at center, #1a1a1a 0%, #000 80%);
      font-family: Arial, sans-serif;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
    }
    h1 {
      margin-top: 20px;
      font-weight: normal;
      letter-spacing: 2px;
      opacity: 0.8;
    }
    .controls {
      margin-top: 10px;
      display: flex;
      gap: 10px;
    }
    input {
      width: 320px;
      padding: 10px;
      border: none;
      border-radius: 6px;
      outline: none;
    }
    button {
      padding: 10px 15px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #ff3b3b;
      color: white;
      font-weight: bold;
    }
    button:hover {
      background: #ff5555;
    }
    .screen-wrapper {
      margin-top: 30px;
      width: 900px;
      max-width: 90vw;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      box-shadow:
        0 0 40px rgba(255, 0, 0, 0.15),
        0 0 120px rgba(0, 0, 0, 0.8);
      border: 2px solid rgba(255,255,255,0.08);
      overflow: hidden;
      position: relative;
    }
    .screen-wrapper::after {
      content: "";
      position: absolute;
      inset: -40px;
      background: radial-gradient(circle, rgba(255,0,0,0.08), transparent 60%);
      pointer-events: none;
    }
    #player {
      width: 100%;
      height: 100%;
    }
    .floor {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 120px;
      background: linear-gradient(to top, #000, transparent);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <h1>Virtual Cinema</h1>
  <div class="controls">
    <input id="videoInput" placeholder="Paste YouTube link or video ID..." />
    <button onclick="loadVideo()">Load</button>
  </div>
  <div class="screen-wrapper">
    <div id="player"></div>
    <div class="floor"></div>
  </div>
  <script>
    let player;
    let tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.body.appendChild(tag);

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        width: '100%',   // fix: explicitly set so iframe fills the wrapper
        height: '100%',
        videoId: 'M7lc1UVf-VE',
        playerVars: {
          rel: 0
          // removed deprecated modestbranding
        },
        events: {
          onReady: () => console.log('Player ready')
        }
      });
    }

    function extractVideoId(url) {
      let match = url.match(/[?&]v=([^&]+)/);
      if (match) return match[1];
      match = url.match(/youtu\.be\/([^?&]+)/);
      if (match) return match[1];
      // fix: only accept valid bare IDs, don't pass garbage to the player
      if (/^[a-zA-Z0-9_-]{11}$/.test(url)) return url;
      return null;
    }

    function loadVideo() {
      const input = document.getElementById("videoInput").value.trim();
      const id = extractVideoId(input);
      if (!player) {
        alert("Player not ready yet, please wait a moment.");
        return;
      }
      if (id) {
        player.loadVideoById(id);
      } else {
        // fix: user now gets feedback on bad input instead of silent failure
        alert("Couldn't find a valid YouTube video ID. Paste a full YouTube link or an 11-character video ID.");
      }
    }
  </script>
</body>
</html>
