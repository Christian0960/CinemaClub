<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Virtual Cinema</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }

    /* ── SCREEN SECTION ── */
    .screen-section {
      flex: 0 0 62%;
      position: relative;
      background: #000;
      border: 2px solid #fff;
      margin: 18px 18px 0 18px;
      border-radius: 4px;
      overflow: hidden;
    }

    /* YouTube fills the whole screen */
    #player {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Load UI overlaid on the screen — hidden once video loads */
    .screen-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 14px;
      background: rgba(0,0,0,0.82);
      z-index: 5;
      transition: opacity 0.4s;
    }

    .screen-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .screen-overlay h2 {
      font-size: 1rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
      font-weight: normal;
    }

    .overlay-controls {
      display: flex;
      gap: 10px;
    }

    .overlay-controls input {
      width: 260px;
      padding: 9px 12px;
      background: #111;
      border: 1px solid #444;
      border-radius: 5px;
      color: white;
      font-family: 'Courier New', monospace;
      font-size: 0.85rem;
      outline: none;
    }

    .overlay-controls input:focus {
      border-color: #ff3b3b;
    }

    .overlay-controls button {
      padding: 9px 18px;
      background: #ff3b3b;
      border: none;
      border-radius: 5px;
      color: white;
      font-weight: bold;
      font-family: 'Courier New', monospace;
      cursor: pointer;
      letter-spacing: 1px;
    }

    .overlay-controls button:hover {
      background: #ff5555;
    }

    /* Screen label top-left, fades out when playing */
    .screen-label {
      position: absolute;
      top: 12px;
      left: 16px;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.25);
      z-index: 4;
      pointer-events: none;
    }

    /* Subtle red glow along bottom of screen */
    .screen-section::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 40px;
      background: linear-gradient(to top, rgba(255,40,40,0.08), transparent);
      pointer-events: none;
      z-index: 3;
    }

    /* ── AUDIENCE SECTION ── */
    .audience-section {
      flex: 1;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 32px;
      padding: 0 40px 0 40px;
      background: #0a0a0a;
      position: relative;
      margin: 0 18px;
    }

    /* Floor line separating screen from audience */
    .audience-section::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: rgba(255,255,255,0.12);
    }

    /* Subtle ambient light from screen hitting audience */
    .audience-section::after {
      content: '';
      position: absolute;
      top: 0; left: 10%; right: 10%;
      height: 60%;
      background: radial-gradient(ellipse at top, rgba(255,60,60,0.04), transparent 70%);
      pointer-events: none;
    }

    /* ── STICK FIGURE ── */
    .person {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      max-width: 120px;
    }

    /* HEAD */
    .head {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2.5px solid rgba(255,255,255,0.75);
      background: transparent;
      flex-shrink: 0;
    }

    /* BODY (chair back + torso) */
    .body {
      width: 72px;
      height: 68px;
      border: 2.5px solid rgba(255,255,255,0.75);
      border-radius: 8px 8px 0 0;
      background: transparent;
      flex-shrink: 0;
    }

    /* CHAIR BASE — extends below body */
    .chair-base {
      width: 88px;
      height: 10px;
      background: rgba(255,255,255,0.15);
      border-radius: 0 0 4px 4px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <!-- SCREEN -->
  <div class="screen-section">
    <div class="screen-label">screen</div>

    <!-- Overlay: load UI lives here, on the screen -->
    <div class="screen-overlay" id="overlay">
      <h2>Virtual Cinema</h2>
      <div class="overlay-controls">
        <input id="videoInput" placeholder="Paste YouTube link or video ID…" />
        <button onclick="loadVideo()">Play</button>
      </div>
    </div>

    <div id="player"></div>
  </div>

  <!-- AUDIENCE -->
  <div class="audience-section">
    <div class="person"><div class="head"></div><div class="body"></div><div class="chair-base"></div></div>
    <div class="person"><div class="head"></div><div class="body"></div><div class="chair-base"></div></div>
    <div class="person"><div class="head"></div><div class="body"></div><div class="chair-base"></div></div>
    <div class="person"><div class="head"></div><div class="body"></div><div class="chair-base"></div></div>
    <div class="person"><div class="head"></div><div class="body"></div><div class="chair-base"></div></div>
  </div>

  <script>
    let player;
    let tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.body.appendChild(tag);

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        width: '100%',
        height: '100%',
        videoId: '',
        playerVars: { rel: 0, controls: 1 },
        events: { onReady: () => console.log('Player ready') }
      });
    }

    function extractVideoId(url) {
      let match = url.match(/[?&]v=([^&]+)/);
      if (match) return match[1];
      match = url.match(/youtu\.be\/([^?&]+)/);
      if (match) return match[1];
      if (/^[a-zA-Z0-9_-]{11}$/.test(url)) return url;
      return null;
    }

    function loadVideo() {
      const input = document.getElementById("videoInput").value.trim();
      const id = extractVideoId(input);
      if (!player) { alert("Player not ready yet."); return; }
      if (id) {
        player.loadVideoById(id);
        // Hide the overlay so the video takes over the screen
        document.getElementById('overlay').classList.add('hidden');
      } else {
        alert("Couldn't find a valid YouTube video ID.");
      }
    }
  </script>
</body>
</html>
