<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Virtual Cinema</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  height: 100vh;
  overflow: hidden;
  font-family: 'Courier New', monospace;
  background: radial-gradient(circle at 50% 20%, #151515 0%, #050505 60%, #000 100%);
}

/* ───────────────── SCREEN ───────────────── */
.screen-section {
  position: relative;
  height: 58%;
  margin: 12px;
  border-radius: 14px;
  overflow: hidden;

  background: #000;
  border: 1px solid rgba(255,255,255,0.08);

  transform: perspective(1200px) rotateX(-5deg);
  transform-origin: top center;

  box-shadow:
    0 80px 180px rgba(0,0,0,0.95),
    inset 0 0 60px rgba(255,255,255,0.04);
}

#player {
  width: 100%;
  height: 100%;
}

/* subtle neutral lighting only */
.screen-section::before {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;

  background: linear-gradient(
    to bottom,
    rgba(255,255,255,0.06),
    transparent 50%,
    rgba(0,0,0,0.6)
  );
}

/* ───────────────── OVERLAY ───────────────── */
.screen-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 14px;

  background: rgba(0,0,0,0.92);
  z-index: 5;

  transition: opacity 0.35s ease;
}

.screen-overlay.hidden {
  opacity: 0;
  pointer-events: none;
}

.screen-overlay h2 {
  letter-spacing: 10px;
  color: rgba(255,255,255,0.6);
  font-weight: 300;
}

.overlay-controls {
  display: flex;
  gap: 10px;
}

.overlay-controls input {
  width: 320px;
  padding: 10px;
  background: #111;
  border: 1px solid #333;
  color: white;
}

/* RED PLAY BUTTON BACK */
.overlay-controls button {
  background: #ff3b3b;
  border: none;
  padding: 10px 18px;
  color: white;
  cursor: pointer;
}

.exit-btn {
  position: absolute;
  top: 12px;
  right: 12px;
  z-index: 10;

  opacity: 0;
  pointer-events: none;

  padding: 6px 10px;
  background: rgba(0,0,0,0.6);
  border: 1px solid rgba(255,255,255,0.15);
  color: white;
}

.exit-btn.visible {
  opacity: 1;
  pointer-events: all;
}

/* ───────────────── AUDIENCE (FIXED GRID LOGIC) ───────────────── */
.audience-section {
  height: 42%;
  margin: 0 12px 12px;
  position: relative;
  overflow: hidden;

  background: linear-gradient(to bottom, #0a0a0a, #000);
  border-radius: 0 0 12px 12px;

  transform: perspective(1200px) rotateX(7deg);
  transform-origin: top center;
}

.rows-container {
  position: absolute;
  bottom: 0;
  width: 100%;
  display: flex;
  flex-direction: column-reverse;

  gap: 8px;
  padding: 10px 10px;
}

/* each row is a tight seating line */
.row {
  display: flex;
  justify-content: center;
  gap: 6px; /* THIS is the key fix */
}

/* 4 rows only */
.row-0 { opacity: 1; }
.row-1 { opacity: 0.85; transform: scale(0.95); }
.row-2 { opacity: 0.7; transform: scale(0.9); }
.row-3 { opacity: 0.55; transform: scale(0.85); }

/* seat unit */
.person {
  display: flex;
  flex-direction: column;
  align-items: center;

  width: 44px;   /* FIXED WIDTH prevents zoom gaps */
}

/* head/body/seat */
.head {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, #222, #000);
  border: 2px solid rgba(255,255,255,0.85);
}

.body {
  width: 34px;
  height: 30px;
  background: linear-gradient(to bottom, #111, #000);
  border: 2px solid rgba(255,255,255,0.8);
  border-radius: 6px;
}

.chair-seat {
  width: 40px;
  height: 7px;
  background: linear-gradient(to bottom, #222, #111);
}

/* row scaling differences (depth illusion only) */
.row-0 .person { transform: scale(1); }
.row-1 .person { transform: scale(0.95); }
.row-2 .person { transform: scale(0.9); }
.row-3 .person { transform: scale(0.85); }

</style>
</head>

<body>

<div class="screen-section">
  <button class="exit-btn" id="exitBtn" onclick="exitVideo()">✕ EXIT</button>

  <div class="screen-overlay" id="overlay">
    <h2>Virtual Cinema</h2>
    <div class="overlay-controls">
      <input id="videoInput" placeholder="Paste YouTube link or video ID…" />
      <button onclick="loadVideo()">▶ Play</button>
    </div>
  </div>

  <div id="player"></div>
</div>

<div class="audience-section">
  <div class="rows-container">

    <!-- ROW 0 -->
    <div class="row row-0">
      <!-- dense seating -->
      <div class="person"><div class="head"></div><div class="body"></div><div class="chair-seat"></div></div>
      <div class="person"><div class="head"></div><div class="body"></div><div class="chair-seat"></div></div>
      <div class="person"><div class="head"></div><div class="body"></div><div class="chair-seat"></div></div>
      <div class="person"><div class="head"></div><div class="body"></div><div class="chair-seat"></div></div>
      <div class="person"><div class="head"></div><div class="body"></div><div class="chair-seat"></div></div>
      <div class="person"><div class="head"></div><div class="body"></div><div class="chair-seat"></div></div>
      <div class="person"><div class="head"></div><div class="body"></div><div class="chair-seat"></div></div>
      <div class="person"><div class="head"></div><div class="body"></div><div class="chair-seat"></div></div>
      <div class="person"><div class="head"></div><div class="body"></div><div class="chair-seat"></div></div>
      <div class="person"><div class="head"></div><div class="body"></div><div class="chair-seat"></div></div>
    </div>

    <!-- ROW 1 -->
    <div class="row row-1">
      <div class="person"></div><div class="person"></div><div class="person"></div><div class="person"></div>
      <div class="person"></div><div class="person"></div><div class="person"></div><div class="person"></div>
      <div class="person"></div><div class="person"></div>
    </div>

    <!-- ROW 2 -->
    <div class="row row-2">
      <div class="person"></div><div class="person"></div><div class="person"></div><div class="person"></div>
      <div class="person"></div><div class="person"></div><div class="person"></div><div class="person"></div>
      <div class="person"></div><div class="person"></div>
    </div>

    <!-- ROW 3 -->
    <div class="row row-3">
      <div class="person"></div><div class="person"></div><div class="person"></div><div class="person"></div>
      <div class="person"></div><div class="person"></div><div class="person"></div><div class="person"></div>
      <div class="person"></div><div class="person"></div>
    </div>

  </div>
</div>

<script>
let player;
let tag = document.createElement('script');
tag.src = "https://www.youtube.com/iframe_api";
document.body.appendChild(tag);

function onYouTubeIframeAPIReady() {
  player = new YT.Player('player', {
    width: '100%',
    height: '100%',
    videoId: '',
    playerVars: { rel: 0, controls: 1 }
  });
}

function extractVideoId(url) {
  let match = url.match(/[?&]v=([^&]+)/);
  if (match) return match[1];
  match = url.match(/youtu\.be\/([^?&]+)/);
  if (match) return match[1];
  if (/^[a-zA-Z0-9_-]{11}$/.test(url)) return url;
  return null;
}

function loadVideo() {
  const input = document.getElementById("videoInput").value.trim();
  const id = extractVideoId(input);

  if (!player) return alert("Player not ready yet.");

  if (id) {
    player.loadVideoById(id);
    document.getElementById('overlay').classList.add('hidden');
    document.getElementById('exitBtn').classList.add('visible');
  }
}

function exitVideo() {
  player.stopVideo();
  document.getElementById('overlay').classList.remove('hidden');
  document.getElementById('exitBtn').classList.remove('visible');
}
</script>

</body>
</html>
