<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CinemaClub - Box Office</title>

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: monospace;
  background: radial-gradient(circle at center, #151515, #000);
  color: white;
}

.container {
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

h1 {
  letter-spacing: 6px;
  opacity: 0.8;
}

button {
  padding: 12px 18px;
  background: #ff3b3b;
  border: none;
  color: white;
  cursor: pointer;
  font-size: 16px;
}

input {
  padding: 12px;
  width: 220px;
  background: #111;
  border: 1px solid #333;
  color: white;
  text-align: center;
}

.row {
  display: flex;
  gap: 10px;
  justify-content: center;
}

#roomDisplay {
  position: absolute;
  top: 20px;
  left: 20px;
  opacity: 0.6;
  font-size: 14px;
}
</style>
</head>

<body>

<div id="roomDisplay">No room</div>

<div class="container">
  <h1>CinemaClub</h1>

  <button onclick="createRoom()">Create Room</button>

  <div class="row">
    <input id="roomCode" placeholder="Enter Room Code">
    <button onclick="joinRoom()">Join</button>
  </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAcJZLOi-tgeCoVNCrr7sEiJQb9G4sjYRE",
  authDomain: "cinemaclub-e264a.firebaseapp.com",
  databaseURL: "https://cinemaclub-e264a-default-rtdb.firebaseio.com",
  projectId: "cinemaclub-e264a",
  storageBucket: "cinemaclub-e264a.firebasestorage.app",
  messagingSenderId: "180570080913",
  appId: "1:180570080913:web:3689a88221571527cce130"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function generateCode(length = 5) {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let code = "";
  for (let i = 0; i < length; i++) {
    code += chars[Math.floor(Math.random() * chars.length)];
  }
  return code;
}

function createRoom() {
  const code = generateCode();

  // create room in Firebase first
  db.ref("rooms/" + code).set({
    videoId: null,
    playing: false,
    createdAt: Date.now()
  });

  window.location.href = `cinema.html?room=${code}`;
}

function joinRoom() {
  const code = document.getElementById("roomCode").value.trim().toUpperCase();
  if (!code) return;

  window.location.href = `cinema.html?room=${code}`;
}
</script>

</body>
</html>
