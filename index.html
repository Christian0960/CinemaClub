<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>CinemaClub</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: black;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      perspective: 1200px;
    }

    /* HEADER + CONTROLS */
    .header {
      position: absolute;
      top: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 14px;
      gap: 10px;
      width: 100%;
      background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent);
      padding-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-weight: normal;
      letter-spacing: 3px;
      opacity: 0.85;
      font-size: 1.1rem;
      text-transform: uppercase;
    }

    .controls {
      display: flex;
      gap: 10px;
    }

    input {
      width: 300px;
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      outline: none;
      background: #222;
      color: white;
      font-size: 0.9rem;
    }

    button {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #ff3b3b;
      color: white;
      font-weight: bold;
      font-size: 0.9rem;
    }

    button:hover {
      background: #ff5555;
    }

    /* CINEMA ROOM */
    .theater {
      width: 100vw;
      height: 100vh;
      position: relative;
      background: radial-gradient(ellipse at center, #111 0%, #000 70%);
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    /* SCREEN */
    .screen {
      width: 70vw;
      height: 40vh;
      margin-top: 12vh;
      background: black;
      border: 2px solid #444;
      box-shadow:
        0 0 80px rgba(255, 255, 255, 0.05),
        0 0 40px rgba(255, 60, 60, 0.1);
      transform: rotateX(-5deg);
      position: relative;
      overflow: hidden;
      border-radius: 4px;
    }

    /* SCREEN LABEL */
    .screen-label {
      position: absolute;
      top: 10px;
      left: 14px;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: white;
      opacity: 0.3;
      pointer-events: none;
      z-index: 1;
      font-family: monospace;
    }

    /* YOUTUBE PLAYER */
    #player {
      width: 100%;
      height: 100%;
    }

    /* FLOOR */
    .floor {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 55vh;
      background: linear-gradient(to top, #000, #111);
      transform: rotateX(60deg);
      transform-origin: bottom;
    }

    /* SEAT ROWS */
    .rows {
      position: absolute;
      bottom: 12vh;
      display: flex;
      flex-direction: column;
      gap: 18px;
      align-items: center;
      width: 100%;
    }

    .row {
      display: flex;
      gap: 18px;
      transform: rotateX(60deg);
    }

    /* SEAT */
    .seat {
      width: 30px;
      height: 40px;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 4px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
      position: relative;
    }

    /* PERSON HEAD ON SEAT */
    .person-head {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #2a2a2a;
      border: 1px solid #444;
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
    }
  </style>
</head>
<body>

  <!-- CONTROLS OVERLAY -->
  <div class="header">
    <h1>CinemaClub</h1>
    <div class="controls">
      <input id="videoInput" placeholder="Paste YouTube link or video ID..." />
      <button onclick="loadVideo()">Load</button>
    </div>
  </div>

  <!-- 3D THEATER -->
  <div class="theater">
    <div class="screen">
      <div class="screen-label">screen</div>
      <div id="player"></div>
    </div>

    <div class="floor"></div>

    <div class="rows">
      <div class="row">
        <div class="seat"><div class="person-head"></div></div>
        <div class="seat"><div class="person-head"></div></div>
        <div class="seat"><div class="person-head"></div></div>
        <div class="seat"><div class="person-head"></div></div>
        <div class="seat"><div class="person-head"></div></div>
      </div>
      <div class="row">
        <div class="seat"><div class="person-head"></div></div>
        <div class="seat"><div class="person-head"></div></div>
        <div class="seat"><div class="person-head"></div></div>
        <div class="seat"><div class="person-head"></div></div>
        <div class="seat"><div class="person-head"></div></div>
      </div>
      <div class="row">
        <div class="seat"><div class="person-head"></div></div>
        <div class="seat"><div class="person-head"></div></div>
        <div class="seat"><div class="person-head"></div></div>
        <div class="seat"><div class="person-head"></div></div>
        <div class="seat"><div class="person-head"></div></div>
      </div>
    </div>
  </div>

  <script>
    let player;
    let tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.body.appendChild(tag);

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        width: '100%',
        height: '100%',
        videoId: 'M7lc1UVf-VE',
        playerVars: {
          rel: 0,
          controls: 1
        },
        events: {
          onReady: () => console.log('Player ready')
        }
      });
    }

    function extractVideoId(url) {
      let match = url.match(/[?&]v=([^&]+)/);
      if (match) return match[1];
      match = url.match(/youtu\.be\/([^?&]+)/);
      if (match) return match[1];
      if (/^[a-zA-Z0-9_-]{11}$/.test(url)) return url;
      return null;
    }

    function loadVideo() {
      const input = document.getElementById("videoInput").value.trim();
      const id = extractVideoId(input);
      if (!player) {
        alert("Player not ready yet, please wait a moment.");
        return;
      }
      if (id) {
        player.loadVideoById(id);
      } else {
        alert("Couldn't find a valid YouTube video ID. Paste a full YouTube link or an 11-character video ID.");
      }
    }
  </script>
</body>
</html>
