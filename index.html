<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CinemaClub - Box Office</title>

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: monospace;
  background: radial-gradient(circle at center, #151515, #000);
  color: white;
}

.container {
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

h1 {
  letter-spacing: 6px;
  opacity: 0.8;
}

button {
  padding: 12px 18px;
  background: #ff3b3b;
  border: none;
  color: white;
  cursor: pointer;
  font-size: 16px;
}

input {
  padding: 12px;
  width: 220px;
  background: #111;
  border: 1px solid #333;
  color: white;
  text-align: center;
}

.row {
  display: flex;
  gap: 10px;
  justify-content: center;
}

/* room display */
#roomDisplay {
  position: absolute;
  top: 20px;
  left: 20px;
  opacity: 0.6;
  font-size: 14px;
}
</style>
</head>

<body>

<div id="roomDisplay">No room</div>

<div class="container">
  <h1>CinemaClub</h1>

  <button onclick="createRoom()">Create Room</button>

  <div class="row">
    <input id="roomCode" placeholder="Enter Room Code">
    <button onclick="joinRoom()">Join</button>
  </div>
</div>

<script>
function generateCode(length = 5) {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let code = "";
  for (let i = 0; i < length; i++) {
    code += chars[Math.floor(Math.random() * chars.length)];
  }
  return code;
}

// simple placeholder state (future multiplayer foundation)
let roomState = {
  videoId: null,
  playing: false,
  time: 0,
  reactions: []
};

function createRoom() {
  const code = generateCode();

  console.log("Created room:", code);

  window.location.href = `cinema.html?room=${code}`;
}

function joinRoom() {
  const code = document.getElementById("roomCode").value.trim().toUpperCase();

  if (!code) return;

  window.location.href = `cinema.html?room=${code}`;
}
</script>

</body>
</html>
