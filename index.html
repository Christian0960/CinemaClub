<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Virtual Cinema</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  height: 100vh;
  overflow: hidden;
  font-family: 'Courier New', monospace;
  background: radial-gradient(circle at 50% 20%, #151515 0%, #050505 60%, #000 100%);
}

/* ───────────────── SCREEN ───────────────── */
.screen-section {
  position: relative;
  height: 58%;
  margin: 12px 12px 0 12px;
  border-radius: 14px;
  overflow: hidden;

  background: #000;
  border: 1px solid rgba(255,255,255,0.08);

  transform: perspective(1200px) rotateX(-6deg);
  transform-origin: top center;

  box-shadow:
    0 80px 180px rgba(0,0,0,0.95),
    0 0 140px rgba(255,40,40,0.18),
    inset 0 0 80px rgba(255,255,255,0.05);
}

#player {
  width: 100%;
  height: 100%;
  position: relative;
  z-index: 1;
}

/* SCREEN LIGHT PROJECTING DOWN INTO THE ROOM */
.screen-section::before {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 2;

  background:
    radial-gradient(circle at 50% 100%,
      rgba(255,80,80,0.35),
      transparent 60%),
    linear-gradient(to bottom,
      rgba(255,255,255,0.06),
      transparent 40%,
      rgba(0,0,0,0.5));
}

/* LIGHT BEAM SPILL INTO AUDIENCE */
.screen-section::after {
  content: '';
  position: absolute;
  bottom: -120px;
  left: -20%;
  width: 140%;
  height: 160px;

  background: radial-gradient(circle,
    rgba(255,60,60,0.18),
    transparent 70%);

  filter: blur(20px);
  pointer-events: none;
}

/* ───────────────── OVERLAY ───────────────── */
.screen-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 14px;

  background: rgba(0,0,0,0.9);
  z-index: 5;

  transition: opacity 0.4s ease, transform 0.4s ease;
}

.screen-overlay.hidden {
  opacity: 0;
  pointer-events: none;
  transform: scale(1.05);
}

.screen-overlay h2 {
  letter-spacing: 10px;
  color: rgba(255,255,255,0.55);
  font-weight: 300;
}

.overlay-controls {
  display: flex;
  gap: 10px;
}

.overlay-controls input {
  width: 320px;
  padding: 10px;
  background: #111;
  border: 1px solid #333;
  color: white;
}

.overlay-controls button {
  background: #ff3b3b;
  border: none;
  padding: 10px 18px;
  color: white;
  cursor: pointer;
}

.exit-btn {
  position: absolute;
  top: 12px;
  right: 12px;
  z-index: 10;

  opacity: 0;
  pointer-events: none;

  padding: 6px 10px;
  background: rgba(0,0,0,0.6);
  border: 1px solid rgba(255,255,255,0.15);
  color: white;
}

.exit-btn.visible {
  opacity: 1;
  pointer-events: all;
}

/* ───────────────── AUDIENCE ───────────────── */
.audience-section {
  height: 42%;
  margin: 0 12px 12px;
  position: relative;
  overflow: hidden;

  background:
    radial-gradient(circle at 50% 0%,
      rgba(255,60,60,0.14),
      transparent 55%),
    linear-gradient(to bottom, #0a0a0a, #000);

  border-radius: 0 0 12px 12px;

  /* subtle room tilt */
  transform: perspective(1200px) rotateX(8deg);
  transform-origin: top center;
}

/* rows fill full width evenly */
.rows-container {
  position: absolute;
  bottom: 0;
  width: 100%;
  display: flex;
  flex-direction: column-reverse;
  align-items: stretch;

  perspective: 900px;
  padding: 10px 20px;
}

/* each row spans full width like real theater */
.row {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;

  width: 100%;
  margin-bottom: 6px;
}

/* depth layers */
.row-0 { transform: translateZ(0px) scale(1); opacity: 1; }
.row-1 { transform: translateZ(-40px) scale(0.92); opacity: 0.9; }
.row-2 { transform: translateZ(-90px) scale(0.82); opacity: 0.72; }
.row-3 { transform: translateZ(-150px) scale(0.70); opacity: 0.52; }
.row-4 { transform: translateZ(-220px) scale(0.60); opacity: 0.38; }

/* no aisles anymore — real theater density */
.person {
  display: flex;
  flex-direction: column;
  align-items: center;
  filter: drop-shadow(0 6px 6px rgba(0,0,0,0.7));
}

/* head */
.head {
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.9);
  background: radial-gradient(circle at 30% 30%, #222, #000);
}

/* body */
.body {
  border: 2px solid rgba(255,255,255,0.85);
  border-radius: 6px;
  background: linear-gradient(to bottom, #111, #000);
}

/* seat */
.chair-seat {
  background: linear-gradient(to bottom, #222, #111);
  box-shadow: 0 4px 10px rgba(0,0,0,0.5);
}

/* consistent scaling per row */
.row-0 .head { width: 44px; height: 44px; }
.row-0 .body { width: 72px; height: 62px; }
.row-0 .chair-seat { width: 88px; height: 10px; }

.row-1 .head { width: 38px; height: 38px; }
.row-1 .body { width: 62px; height: 54px; }
.row-1 .chair-seat { width: 76px; height: 9px; }

.row-2 .head { width: 32px; height: 32px; }
.row-2 .body { width: 52px; height: 46px; }
.row-2 .chair-seat { width: 64px; height: 8px; }

.row-3 .head { width: 26px; height: 26px; }
.row-3 .body { width: 42px; height: 38px; }
.row-3 .chair-seat { width: 52px; height: 7px; }

.row-4 .head { width: 20px; height: 20px; }
.row-4 .body { width: 34px; height: 30px; }
.row-4 .chair-seat { width: 42px; height: 6px; }

</style>
</head>

<script>
let player;
let tag = document.createElement('script');
tag.src = "https://www.youtube.com/iframe_api";
document.body.appendChild(tag);

function onYouTubeIframeAPIReady() {
  player = new YT.Player('player', {
    width: '100%',
    height: '100%',
    videoId: '',
    playerVars: { rel: 0, controls: 1 }
  });
}

function extractVideoId(url) {
  let match = url.match(/[?&]v=([^&]+)/);
  if (match) return match[1];
  match = url.match(/youtu\.be\/([^?&]+)/);
  if (match) return match[1];
  if (/^[a-zA-Z0-9_-]{11}$/.test(url)) return url;
  return null;
}

function loadVideo() {
  const input = document.getElementById("videoInput").value.trim();
  const id = extractVideoId(input);

  if (!player) return alert("Player not ready yet.");

  if (id) {
    player.loadVideoById(id);
    document.getElementById('overlay').classList.add('hidden');
    document.getElementById('exitBtn').classList.add('visible');
  }
}

function exitVideo() {
  player.stopVideo();
  document.getElementById('overlay').classList.remove('hidden');
  document.getElementById('exitBtn').classList.remove('visible');
}
</script>
