<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>CinemaClub</title>
  <style>
    body {
      margin: 0;
      background: radial-gradient(circle at center, #1a1a1a 0%, #000 80%);
      font-family: Arial, sans-serif;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    h1 {
      margin: 16px 0 10px;
      font-weight: normal;
      letter-spacing: 2px;
      opacity: 0.8;
      flex-shrink: 0;
    }

    .controls {
      display: flex;
      gap: 10px;
      flex-shrink: 0;
      margin-bottom: 12px;
    }

    input {
      width: 320px;
      padding: 10px;
      border: none;
      border-radius: 6px;
      outline: none;
      background: #222;
      color: white;
    }

    button {
      padding: 10px 15px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #ff3b3b;
      color: white;
      font-weight: bold;
    }

    button:hover {
      background: #ff5555;
    }

    /* OUTER THEATER FRAME */
    .theater {
      width: 90vw;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 12px;
      overflow: hidden;
      box-shadow:
        0 0 40px rgba(255, 0, 0, 0.15),
        0 0 120px rgba(0, 0, 0, 0.8);
      margin-bottom: 16px;
    }

    /* SCREEN AREA */
    .screen {
      flex: 3;
      border-bottom: 2px solid rgba(255,255,255,0.2);
      position: relative;
      background: #000;
    }

    /* YOUTUBE PLAYER FILLS SCREEN */
    #player {
      width: 100%;
      height: 100%;
    }

    /* SCREEN LABEL */
    .screen-label {
      position: absolute;
      top: 12px;
      left: 16px;
      color: white;
      opacity: 0.4;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      pointer-events: none;
      z-index: 1;
    }

    /* SEATING AREA */
    .seats {
      flex: 1;
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: #0a0a0a;
      padding: 0 20px;
    }

    /* EACH SEAT */
    .chair {
      width: 70px;
      height: 70px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 10px;
      position: relative;
      background: #111;
    }

    /* PERSON HEAD */
    .person-head {
      width: 26px;
      height: 26px;
      border: 2px solid rgba(255,255,255,0.5);
      border-radius: 50%;
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: #1a1a1a;
    }

    /* PERSON BODY */
    .person-body {
      width: 36px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 6px 6px 0 0;
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      background: #1a1a1a;
    }
  </style>
</head>
<body>
  <h1>CinemaCLub</h1>
  <div class="controls">
    <input id="videoInput" placeholder="Paste YouTube link or video ID..." />
    <button onclick="loadVideo()">Load</button>
  </div>

  <div class="theater">
    <div class="screen">
      <div id="player"></div>
      <div class="screen-label">screen</div>
    </div>
    <div class="seats">
      <div class="chair"><div class="person-head"></div><div class="person-body"></div></div>
      <div class="chair"><div class="person-head"></div><div class="person-body"></div></div>
      <div class="chair"><div class="person-head"></div><div class="person-body"></div></div>
      <div class="chair"><div class="person-head"></div><div class="person-body"></div></div>
      <div class="chair"><div class="person-head"></div><div class="person-body"></div></div>
    </div>
  </div>

  <script>
    let player;
    let tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.body.appendChild(tag);

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        width: '100%',
        height: '100%',
        videoId: 'M7lc1UVf-VE',
        playerVars: {
          rel: 0,
          controls: 1
        },
        events: {
          onReady: () => console.log('Player ready')
        }
      });
    }

    function extractVideoId(url) {
      let match = url.match(/[?&]v=([^&]+)/);
      if (match) return match[1];
      match = url.match(/youtu\.be\/([^?&]+)/);
      if (match) return match[1];
      if (/^[a-zA-Z0-9_-]{11}$/.test(url)) return url;
      return null;
    }

    function loadVideo() {
      const input = document.getElementById("videoInput").value.trim();
      const id = extractVideoId(input);
      if (!player) {
        alert("Player not ready yet, please wait a moment.");
        return;
      }
      if (id) {
        player.loadVideoById(id);
      } else {
        alert("Couldn't find a valid YouTube video ID. Paste a full YouTube link or an 11-character video ID.");
      }
    }
  </script>
</body>
</html>
