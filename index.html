<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Virtual Cinema Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    input { padding: 10px; width: 300px; margin-right: 10px; }
    button { padding: 10px; cursor: pointer; }
    #player { margin-top: 20px; }
  </style>
</head>
<body>
  <h1>Virtual Cinema Test</h1>
  <div>
    <input id="videoId" placeholder="Enter YouTube link or video ID" />
    <button onclick="loadVideo()">Load Video</button>
  </div>
  <div id="player"></div>

  <script>
    let player;

    let tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.body.appendChild(tag);

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '480',
        width: '854',
        videoId: 'dQw4w9WgXcQ',
        events: {
          'onReady': () => console.log("Player ready")
        }
      });
    }

    function extractVideoId(url) {
      try {
        let match = url.match(/[?&]v=([^&]+)/);
        if (match) return match[1];
        match = url.match(/youtu\.be\/([^?&]+)/);
        if (match) return match[1];
        return url;
      } catch (e) {
        return null;
      }
    }

    function loadVideo() {
      const input = document.getElementById("videoId").value.trim();
      const id = extractVideoId(input);
      if (!player) {
        alert("Player not ready yet, please wait.");
      } else if (id) {
        player.loadVideoById(id);
      } else {
        alert("Invalid YouTube link");
      }
    }
  </script>
</body>
</html>
