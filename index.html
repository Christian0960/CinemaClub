<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Virtual Cinema Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    input {
      padding: 10px;
      width: 300px;
      margin-right: 10px;
    }

    button {
      padding: 10px;
      cursor: pointer;
    }

    #player {
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <h1>Virtual Cinema Test</h1>

  <div>
    <input id="videoId" placeholder="Enter YouTube Video ID (not full link)" />
    <button onclick="loadVideo()">Load Video</button>
  </div>

  <div id="player"></div>

  <script>
    let player;

    // Load YouTube API
    let tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.body.appendChild(tag);

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '480',
        width: '854',
        videoId: 'dQw4w9WgXcQ', // default video
        events: {
          'onReady': () => console.log("Player ready")
        }
      });
    }

<script>
function extractVideoId(url) {
  try {
    // Case 1: full watch URL
    let match = url.match(/[?&]v=([^&]+)/);
    if (match) return match[1];

    // Case 2: youtu.be short link
    match = url.match(/youtu\.be\/([^?&]+)/);
    if (match) return match[1];

    // Case 3: already an ID
    return url;
  } catch (e) {
    return null;
  }
}

function loadVideo() {
  const input = document.getElementById("videoId").value.trim();
  const id = extractVideoId(input);

  if (id && player) {
    player.loadVideoById(id);
  } else {
    alert("Invalid YouTube link");
  }
}
</script>

</body>
</html>
