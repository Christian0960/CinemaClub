<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>CinemaClub</title>


  
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  height: 100vh;
  overflow: hidden;
  font-family: 'Courier New', monospace;
  background: radial-gradient(circle at 50% 20%, #151515 0%, #050505 60%, #000 100%);
}

/* ───────────────── SCREEN ───────────────── */
.screen-section {
  position: relative;
  height: 58%;
  margin: 12px 12px 0 12px;
  border-radius: 14px;
  overflow: hidden;

  background: #000;
  border: 1px solid rgba(255,255,255,0.08);

  transform: perspective(1200px) rotateX(-6deg);
  transform-origin: top center;

 box-shadow:
  0 80px 180px rgba(0,0,0,0.95),
  inset 0 0 80px rgba(255,255,255,0.05),
  0 0 25px rgba(120, 80, 255, 0.35),
  0 0 60px rgba(80, 180, 255, 0.25);

  outline: 1px solid rgba(120, 80, 255, 0.25);
}

#player {
  width: 100%;
  height: 100%;
  position: relative;
  z-index: 1;
}

/* SCREEN LIGHT PROJECTING DOWN INTO THE ROOM */
.screen-section::before {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 2;

  background:
    linear-gradient(to bottom,
      rgba(255,255,255,0.06),
      transparent 40%,
      rgba(0,0,0,0.5));
}

/* LIGHT BEAM SPILL INTO AUDIENCE */
.screen-section::after {
  content: '';
  position: absolute;
  bottom: -120px;
  left: -20%;
  width: 140%;
  height: 160px;

  background: transparent;

  pointer-events: none;
}

/* ───────────────── OVERLAY ───────────────── */
.screen-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 14px;

  background: rgba(0,0,0,0.9);
  z-index: 5;

  transition: opacity 0.4s ease, transform 0.4s ease;
}

.screen-overlay.hidden {
  opacity: 0;
  pointer-events: none;
  transform: scale(1.05);
}

.screen-overlay h2 {
  letter-spacing: 10px;
  color: rgba(255,255,255,0.55);
  font-weight: 300;
}

.overlay-controls {
  display: flex;
  gap: 10px;
}

.overlay-controls input {
  width: 320px;
  padding: 10px;
  background: #111;
  border: 1px solid #333;
  color: white;
}

.overlay-controls button {
  background: #ff3b3b;
  border: none;
  padding: 10px 18px;
  color: white;
  cursor: pointer;
}

.exit-btn {
  position: absolute;
  top: 12px;
  right: 12px;
  z-index: 10;

  opacity: 0;
  pointer-events: none;

  padding: 6px 10px;
  background: rgba(0,0,0,0.6);
  border: 1px solid rgba(255,255,255,0.15);
  color: white;
}

.exit-btn.visible {
  opacity: 1;
  pointer-events: all;
}

/* ───────────────── AUDIENCE ───────────────── */
.audience-section {
  height: 42%;
  margin: 0 12px 12px;
  position: relative;
  overflow: hidden;

  background:
    linear-gradient(to bottom, #0a0a0a, #000);

  border-radius: 0 0 12px 12px;

  transform: perspective(1200px) rotateX(8deg);
  transform-origin: top center;
}

/* rows fill full width evenly */
.rows-container {
  position: absolute;
  bottom: 0;

  /* equal aisles */
  left: 120px;
  right: 120px;

  display: flex;
  flex-direction: column-reverse;
  align-items: stretch;

  perspective: 900px;
  padding: 10px 0;
}

/* each row spans full width like real theater */
.row {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;

  width: 100%;
  margin-bottom: 6px;
}

/* depth layers */
.row-0 {
    transform: translateX(0px) translateZ(0px) scale(1);
    opacity: 1;
}
.row-1 { transform: translateZ(-40px) scale(0.92); opacity: 0.9; } 
.row-2 { transform: translateZ(-90px) scale(0.82); opacity: 0.72; } 
.row-3 { transform: translateZ(-150px) scale(0.70); opacity: 0.52; } 
.row-4 { transform: translateZ(-220px) scale(0.60); opacity: 0.38; }

.person {
  display: flex;
  flex-direction: column;
  align-items: center;
  filter: drop-shadow(0 6px 6px rgba(0,0,0,0.7));
}

.head {
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.9);
  background: radial-gradient(circle at 30% 30%, #222, #000);
}

.body {
  border: 2px solid rgba(255,255,255,0.85);
  border-radius: 6px;
  background: linear-gradient(to bottom, #111, #000);
}

.chair-seat {
  background: linear-gradient(to bottom, #222, #111);
  box-shadow: 0 4px 10px rgba(0,0,0,0.5);
}

.row-0 .head { width: 44px; height: 44px; }
.row-0 .body { width: 72px; height: 62px; }
.row-0 .chair-seat { width: 88px; height: 10px; }

.row-1 .head { width: 38px; height: 38px; }
.row-1 .body { width: 62px; height: 54px; }
.row-1 .chair-seat { width: 76px; height: 9px; }

.row-2 .head { width: 32px; height: 32px; }
.row-2 .body { width: 52px; height: 46px; }
.row-2 .chair-seat { width: 64px; height: 8px; }

.row-3 .head { width: 26px; height: 26px; }
.row-3 .body { width: 42px; height: 38px; }
.row-3 .chair-seat { width: 52px; height: 7px; }

.row-4 .head { width: 20px; height: 20px; }
.row-4 .body { width: 34px; height: 30px; }
.row-4 .chair-seat { width: 42px; height: 6px; }

  /* ───────────────── REACTIONS ───────────────── */
.reactions-container {
  
  position: absolute;
  bottom: 35px;
  left: 35px;

  transform: translateX(8px);

  z-index: 20;
}

.reaction-toggle {
  width: 70px;
  height: 70px;

  border: 3px solid rgba(255,255,255,0.15);
  border-radius: 14px;

  background: rgba(15,15,15,0.9);
  color: white;
  font-size: 28px;

  cursor: pointer;

  box-shadow:
    0 10px 25px rgba(0,0,0,0.5),
    inset 0 0 20px rgba(255,255,255,0.03);

  transition: all 0.2s ease;
}

.reaction-toggle:hover {
  transform: translateY(-2px);
  background: rgba(25,25,25,0.95);
}

.reaction-menu {
  position: absolute;
  bottom: 80px;
  left: 0;

  display: flex;
  flex-direction: column;
  gap: 8px;

  opacity: 0;
  pointer-events: none;
  transform: translateY(10px);

  transition: all 0.25s ease;
}

.reaction-menu.open {
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0);
}

.reaction-btn {
  width: 100px;
  padding: 12px;

  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 12px;

  background: rgba(20,20,20,0.95);
  color: white;

  cursor: pointer;

  box-shadow:
    0 8px 20px rgba(0,0,0,0.4);

  transition: all 0.2s ease;
}

.reaction-btn:hover {
  transform: translateX(4px);
  background: rgba(35,35,35,0.95);
}

.reaction-popup {
  position: fixed;
  bottom: 180px;
  left: 120px;

  font-size: 40px;
  color: white;

  pointer-events: none;
  animation: floatUp 2s forwards;
}

@keyframes floatUp {
  0% {
    opacity: 0;
    transform: translateY(20px) scale(0.8);
  }

  20% {
    opacity: 1;
  }

  100% {
    opacity: 0;
    transform: translateY(-100px) scale(1.3);
  }
}

  #roomDisplay {
  position: absolute;
  top: 20px;
  left: 20px;
  color: rgba(255,255,255,0.6);
  font-size: 14px;
  z-index: 50;
}

</style>
</head>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAcJZLOi-tgeCoVNCrr7sEiJQb9G4sjYRE",
  authDomain: "cinemaclub-e264a.firebaseapp.com",
  databaseURL: "https://cinemaclub-e264a-default-rtdb.firebaseio.com",
  projectId: "cinemaclub-e264a",
  storageBucket: "cinemaclub-e264a.firebasestorage.app",
  messagingSenderId: "180570080913",
  appId: "1:180570080913:web:3689a88221571527cce130"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

window.addEventListener("DOMContentLoaded", () => {

  // ───────────────── ROOM ─────────────────
  const roomCode = new URLSearchParams(window.location.search).get("room");
  const display = document.getElementById("roomDisplay");
  const roomRef = db.ref("rooms/" + roomCode);

  const clientId = crypto.randomUUID();
  let isHost = false;

  if (display) {
    display.textContent = roomCode ? `ROOM: ${roomCode}` : "NO ROOM";
  }

  // ───────────────── HOST DETECTION ─────────────────
  roomRef.once("value").then((snap) => {
    const data = snap.val();

    if (!data || !data.host) {
      // first person becomes host
      roomRef.set({
        host: clientId,
        videoId: null,
        playing: false,
        currentTime: 0,
        lastUpdate: Date.now()
      });
      isHost = true;
      console.log("You are HOST");
    } else {
      isHost = data.host === clientId;
      console.log("Host status:", isHost);
    }
  });

  // ───────────────── YOUTUBE ─────────────────
  let player;

  const tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  document.body.appendChild(tag);

  window.onYouTubeIframeAPIReady = function () {
    player = new YT.Player('player', {
      width: '100%',
      height: '100%',
      videoId: '',
      playerVars: { rel: 0, controls: 1 }
    });
  };

  // ───────────────── SYNC LISTENER ─────────────────
  roomRef.on("value", (snap) => {
    const data = snap.val();
    if (!data || !player) return;

    const now = Date.now();
    const elapsed = (now - (data.lastUpdate || now)) / 1000;

    // ── VIDEO LOAD ──
    if (data.videoId) {
      const current = player.getVideoData().video_id;

      if (current !== data.videoId) {
        player.loadVideoById(data.videoId);
      }

      document.getElementById("overlay").classList.add("hidden");
      document.getElementById("exitBtn").classList.add("visible");
    }

    // ── TIMELINE SYNC ──
    if (typeof data.currentTime === "number") {

      const targetTime = data.playing
        ? data.currentTime + elapsed
        : data.currentTime;

      player.seekTo(targetTime, true);

      if (data.playing) {
        player.playVideo();
      } else {
        player.pauseVideo();
      }
    }
  });

  // ───────────────── DRIFT CORRECTION LOOP ─────────────────
  setInterval(() => {
    if (!player) return;

    roomRef.once("value").then((snap) => {
      const data = snap.val();
      if (!data) return;

      const now = Date.now();
      const elapsed = (now - (data.lastUpdate || now)) / 1000;

      const expected = data.playing
        ? data.currentTime + elapsed
        : data.currentTime;

      const actual = player.getCurrentTime();
      const drift = Math.abs(expected - actual);

      if (drift > 1.5) {
        player.seekTo(expected, true);
      }

      if (data.playing && player.getPlayerState() !== 1) {
        player.playVideo();
      }

      if (!data.playing && player.getPlayerState() === 1) {
        player.pauseVideo();
      }
    });
  }, 2000);

  // ───────────────── HOST HEARTBEAT ─────────────────
  setInterval(() => {
    if (!player || !isHost) return;

    roomRef.update({
      currentTime: player.getCurrentTime(),
      lastUpdate: Date.now()
    });
  }, 3000);

  // ───────────────── VIDEO INPUT ─────────────────
  function extractVideoId(url) {
    let match = url.match(/[?&]v=([^&]+)/);
    if (match) return match[1];

    match = url.match(/youtu\.be\/([^?&]+)/);
    if (match) return match[1];

    if (/^[a-zA-Z0-9_-]{11}$/.test(url)) return url;

    return null;
  }

  window.loadVideo = function () {
    if (!isHost) return; // ONLY HOST CAN CONTROL

    const input = document.getElementById("videoInput").value.trim();
    const id = extractVideoId(input);

    if (!id) return;

    roomRef.set({
      host: clientId,
      videoId: id,
      playing: true,
      currentTime: 0,
      lastUpdate: Date.now()
    });
  };

  window.exitVideo = function () {
    if (!isHost) return;

    roomRef.update({
      playing: false,
      videoId: null,
      currentTime: 0,
      lastUpdate: Date.now()
    });

    if (player) player.stopVideo();

    document.getElementById('overlay').classList.remove('hidden');
    document.getElementById('exitBtn').classList.remove('visible');
  };

  // ───────────────── REACTIONS ─────────────────
  window.toggleReactions = function () {
    document.getElementById("reactionMenu").classList.toggle("open");
  };

  window.sendReaction = function (reaction) {

    document.getElementById("reactionMenu").classList.remove("open");

    const popup = document.createElement("div");
    popup.className = "reaction-popup";
    popup.textContent = reaction;
    document.body.appendChild(popup);

    setTimeout(() => popup.remove(), 2000);

    let sound;

    if (reaction === "Clap") sound = document.getElementById("clapSound");
    if (reaction === "Cheer") sound = document.getElementById("cheerSound");
    if (reaction === "Boo") sound = document.getElementById("booSound");

    if (sound) {
      sound.currentTime = 0;
      sound.play().catch(() => {});
    }
  };

  document.addEventListener("click", (e) => {
    const menu = document.getElementById("reactionMenu");
    const container = document.querySelector(".reactions-container");

    if (container && !container.contains(e.target)) {
      menu.classList.remove("open");
    }
  });

});
</script>
</body>
</html>
